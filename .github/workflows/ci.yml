name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      production_hosts: ${{ steps.fleet.outputs.production_hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A nearly full hosted runner can kill Nix without producing a useful
      # evaluation error. Keep swap available, but reclaim the same space as
      # the per-host build jobs before evaluating and building every check.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main 2026-08-07
        with:
          tool-cache: true
          large-packages: true
          swap-storage: false
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main 2026-08-07
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: guildedthorn
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Fixed-output/source derivations are cheap to refetch from their
          # original URL and aren't worth cache storage.
          pushFilter: '(-source$|\.tar\.gz$)'
      - uses: DeterminateSystems/flake-checker-action@3164002371bc90729c68af0e24d5aacf20d7c9f6 # v12
      - name: Read the authoritative production fleet
        id: fleet
        run: |
          set -euo pipefail
          inventory_hosts=$(nix eval --json .#thornixFleet --apply builtins.attrNames)
          configuration_hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)
          if [[ "$inventory_hosts" != "$configuration_hosts" ]]; then
            echo "hosts/inventory.nix and nixosConfigurations do not have identical keys" >&2
            echo "inventory:     $inventory_hosts" >&2
            echo "configurations: $configuration_hosts" >&2
            exit 1
          fi
          flake_revision=$(nix eval --raw .#thornixRevision)
          git_revision=$(git rev-parse HEAD)
          if [[ "$flake_revision" != "$git_revision" ]]; then
            echo "flake revision stamp does not match the checked-out commit" >&2
            echo "flake: $flake_revision" >&2
            echo "git:   $git_revision" >&2
            exit 1
          fi
          echo "production_hosts=$(nix eval --json .#productionHosts)" >> "$GITHUB_OUTPUT"

      # A monolithic `nix flake check` evaluates every NixOS configuration and
      # Hydra job in one process. As this flake grew, that evaluator began
      # exhausting the hosted runner and losing its GitHub heartbeat. Validate
      # each configuration's required toplevel in a fresh process so its heap
      # is released before moving to the next host. The bootstrap matrix below
      # subsequently builds every production derivation, while Forge evaluates
      # the aggregate Hydra job after cutover.
      - name: Evaluate every NixOS configuration
        run: |
          set -euo pipefail

          hosts="$(
            nix eval --raw .#nixosConfigurations \
              --apply 'configs: builtins.concatStringsSep "\n" (builtins.attrNames configs)'
          )"

          for host in ${hosts}; do
            echo "::group::Evaluating ${host}"
            nix eval --raw \
              ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
            echo
            echo "::endgroup::"
          done

  build:
    runs-on: ubuntu-latest
    needs: flake-check
    # This is the safe bootstrap builder until Forge has a working jobset,
    # Cachix credentials, and promoter. Setting the repository variable
    # FORGE_CI_ENABLED=true retires this matrix without another code change.
    if: >-
      vars.FORGE_CI_ENABLED != 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      # No concurrency cap: max-parallel existed to avoid throttling
      # GitHub's Actions Cache API (the old FlakeHub-less magic-nix-cache
      # fallback). Cachix is a dedicated service built for concurrent CI
      # load, so that constraint no longer applies — let all hosts run
      # at once instead of serializing into batches.
      matrix:
        host: ${{ fromJSON(needs.flake-check.outputs.production_hosts) }}
    steps:
      # Promotion is intentionally fast-forward-only. The default shallow
      # checkout cannot prove that an existing deployment tip is an ancestor
      # of HEAD and rejects an otherwise valid push with "fetch first".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # ubuntu-latest ships with ~30-40GB of preinstalled toolchains we
      # never touch (dotnet, Android SDK, GHC, ...), leaving only ~14GB
      # free — not enough for hosts whose closure builds huge from-source
      # paths (e.g. the workstation's rocblas). Reclaim it before Nix ever
      # writes to the store. swap-storage stays (rocblas's compile is
      # memory-heavy — dropping swap trades a disk error for an OOM).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main 2026-08-07
        with:
          tool-cache: true
          large-packages: true
          swap-storage: false
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main 2026-08-07
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: guildedthorn
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          pushFilter: '(-source$|\.tar\.gz$)'
      - name: Build ${{ matrix.host }}
        run: |
          nix build --no-link \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  promote-production:
    runs-on: ubuntu-latest
    needs: [flake-check, build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.FORGE_CI_ENABLED != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Promote the verified fleet
        env:
          PRODUCTION_HOSTS_JSON: ${{ needs.flake-check.outputs.production_hosts }}
        run: |
          set -euo pipefail

          # Until Forge takes over, advance production and every legacy
          # per-host pointer together. This is deliberately repeated on each
          # bootstrap promotion: it also handles a pre-existing production
          # branch while old hosts still need the commit that moves comin to
          # production. No ref is forced, and --atomic prevents a partial
          # cutover if any history is unexpectedly divergent.
          refs=(HEAD:refs/heads/production)
          while IFS= read -r host; do
            refs+=("HEAD:refs/heads/deploy-${host}")
          done < <(jq -r '.[]' <<<"$PRODUCTION_HOSTS_JSON")
          git push --atomic origin "${refs[@]}"
