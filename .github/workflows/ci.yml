name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@v12
      - run: nix flake check

  build:
    runs-on: ubuntu-latest
    # A broken flake (bad syntax, a failing check output, ...) can leave a
    # host's own evaluation looking fine in isolation — don't promote any
    # host's deploy branch unless the whole flake is known-good first.
    needs: flake-check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # GitHub's Actions Cache API throttles magic-nix-cache-action under
      # concurrent load (we're not FlakeHub-authenticated, so it falls back to
      # the GHA cache as its backing store) — 10 matrix jobs all hitting it at
      # once regularly trips "rate limit exceeded" on an otherwise-unrelated
      # host's build. Capping concurrency keeps us under that ceiling.
      max-parallel: 4
      matrix:
        host:
          - firewall
          - mac
          - mitm
          - nixos
          - proxmox-guest
          - proxmox-mitm
          - websites
          - scout
          - vmware-guest
          - vmware-test
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Evaluate ${{ matrix.host }}
        run: |
          nix build --dry-run --no-link \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
      # comin on each host tracks deploy-<hostname> instead of main (see
      # modules/users/thorn.nix) — only fast-forward it here, once this
      # host's own build has actually passed, so a broken commit for one
      # host can never get deployed just because main advanced.
      - name: Promote deploy-${{ matrix.host }}
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: git push origin HEAD:refs/heads/deploy-${{ matrix.host }} --force
