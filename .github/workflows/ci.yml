name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # A nearly full hosted runner can kill Nix without producing a useful
      # evaluation error. Keep swap available, but reclaim the same space as
      # the per-host build jobs before evaluating and building every check.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          swap-storage: false
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: guildedthorn
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Fixed-output/source derivations are cheap to refetch from their
          # original URL and aren't worth cache storage.
          pushFilter: '(-source$|\.tar\.gz$)'
      - uses: DeterminateSystems/flake-checker-action@v12
      # `nix flake check` evaluates every nixosConfiguration in one process.
      # As this flake grew, that evaluator began exhausting the hosted
      # runner and losing its GitHub heartbeat. This flake currently exposes
      # only nixosConfigurations, so validate the same required toplevel
      # attribute for every host in a fresh process and release its heap
      # before moving to the next host. The build matrix below subsequently
      # builds every one of these exact derivations.
      - name: Evaluate every NixOS configuration
        run: |
          set -euo pipefail

          hosts="$(
            nix eval --raw .#nixosConfigurations \
              --apply 'configs: builtins.concatStringsSep "\n" (builtins.attrNames configs)'
          )"

          for host in ${hosts}; do
            echo "::group::Evaluating ${host}"
            nix eval --raw \
              ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
            echo
            echo "::endgroup::"
          done

  build:
    runs-on: ubuntu-latest
    # A broken flake (bad syntax, a failing check output, ...) can leave a
    # host's own evaluation looking fine in isolation — don't promote any
    # host's deploy branch unless the whole flake is known-good first.
    needs: flake-check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # No concurrency cap: max-parallel existed to avoid throttling
      # GitHub's Actions Cache API (the old FlakeHub-less magic-nix-cache
      # fallback). Cachix is a dedicated service built for concurrent CI
      # load, so that constraint no longer applies — let all hosts run
      # at once instead of serializing into batches.
      matrix:
        host:
          - anvil
          - atlas
          - firewall
          - hound
          - identity
          - mac
          - mitm
          - nixos
          - pixie
          - proxmox-guest
          - websites
          - scout
          - sieve
          - soc
          - vmware-guest
          - vmware-test
    steps:
      # Promotion is intentionally fast-forward-only. The default shallow
      # checkout cannot prove that an existing deploy-* tip is an ancestor
      # of HEAD and rejects an otherwise valid push with "fetch first".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # ubuntu-latest ships with ~30-40GB of preinstalled toolchains we
      # never touch (dotnet, Android SDK, GHC, ...), leaving only ~14GB
      # free — not enough for hosts whose closure builds huge from-source
      # paths (e.g. the workstation's rocblas). Reclaim it before Nix ever
      # writes to the store. swap-storage stays (rocblas's compile is
      # memory-heavy — dropping swap trades a disk error for an OOM).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          swap-storage: false
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: guildedthorn
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          pushFilter: '(-source$|\.tar\.gz$)'
      - name: Build ${{ matrix.host }}
        run: |
          nix build --no-link \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
      # comin on each host tracks deploy-<hostname> instead of main (see
      # modules/users/thorn.nix) — only fast-forward it here, once this
      # host's own build has actually passed, so a broken commit for one
      # host can never get deployed just because main advanced.
      #
      # Do not force this update. If main was rewritten, a rejected push is
      # the safety signal: force-moving the branch strands hosts on the old
      # history, where comin fetches forever without scheduling a build.
      - name: Promote deploy-${{ matrix.host }}
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: git push origin HEAD:refs/heads/deploy-${{ matrix.host }}
