name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: guildedthorn
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Fixed-output/source derivations are cheap to refetch from their
          # original URL and aren't worth cache storage.
          pushFilter: '(-source$|\.tar\.gz$)'
      - uses: DeterminateSystems/flake-checker-action@v12
      - run: nix flake check

  build:
    runs-on: ubuntu-latest
    # A broken flake (bad syntax, a failing check output, ...) can leave a
    # host's own evaluation looking fine in isolation — don't promote any
    # host's deploy branch unless the whole flake is known-good first.
    needs: flake-check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Real builds (not just eval) are heavier per-job — keep a concurrency
      # cap so 10 hosts don't all hammer the runner pool / Cachix at once.
      max-parallel: 4
      matrix:
        host:
          - firewall
          - mac
          - mitm
          - nixos
          - proxmox-guest
          - proxmox-mitm
          - websites
          - scout
          - vmware-guest
          - vmware-test
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: guildedthorn
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          pushFilter: '(-source$|\.tar\.gz$)'
      - name: Build ${{ matrix.host }}
        run: |
          nix build --no-link \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
      # comin on each host tracks deploy-<hostname> instead of main (see
      # modules/users/thorn.nix) — only fast-forward it here, once this
      # host's own build has actually passed, so a broken commit for one
      # host can never get deployed just because main advanced.
      - name: Promote deploy-${{ matrix.host }}
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: git push origin HEAD:refs/heads/deploy-${{ matrix.host }} --force
