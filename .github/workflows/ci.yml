name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: guildedthorn
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Fixed-output/source derivations are cheap to refetch from their
          # original URL and aren't worth cache storage.
          pushFilter: '(-source$|\.tar\.gz$)'
      - uses: DeterminateSystems/flake-checker-action@v12
      - run: nix flake check

  build:
    runs-on: ubuntu-latest
    # A broken flake (bad syntax, a failing check output, ...) can leave a
    # host's own evaluation looking fine in isolation — don't promote any
    # host's deploy branch unless the whole flake is known-good first.
    needs: flake-check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # No concurrency cap: max-parallel existed to avoid throttling
      # GitHub's Actions Cache API (the old FlakeHub-less magic-nix-cache
      # fallback). Cachix is a dedicated service built for concurrent CI
      # load, so that constraint no longer applies — let all 10 hosts run
      # at once instead of serializing into batches.
      matrix:
        host:
          - firewall
          - mac
          - mitm
          - nixos
          - proxmox-guest
          - websites
          - scout
          - soc
          - vmware-guest
          - vmware-test
    steps:
      - uses: actions/checkout@v7
      # ubuntu-latest ships with ~30-40GB of preinstalled toolchains we
      # never touch (dotnet, Android SDK, GHC, ...), leaving only ~14GB
      # free — not enough for hosts whose closure builds huge from-source
      # paths (e.g. the workstation's rocblas). Reclaim it before Nix ever
      # writes to the store. swap-storage stays (rocblas's compile is
      # memory-heavy — dropping swap trades a disk error for an OOM).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          swap-storage: false
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: guildedthorn
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          pushFilter: '(-source$|\.tar\.gz$)'
      - name: Build ${{ matrix.host }}
        run: |
          nix build --no-link \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
      # comin on each host tracks deploy-<hostname> instead of main (see
      # modules/users/thorn.nix) — only fast-forward it here, once this
      # host's own build has actually passed, so a broken commit for one
      # host can never get deployed just because main advanced.
      #
      # Do not force this update. If main was rewritten, a rejected push is
      # the safety signal: force-moving the branch strands hosts on the old
      # history, where comin fetches forever without scheduling a build.
      - name: Promote deploy-${{ matrix.host }}
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: git push origin HEAD:refs/heads/deploy-${{ matrix.host }}
