services:
  redis:
    image: redis:8.8.0@sha256:5d2c689b4b55fc3fab4b0cc8aaa950f85b508c76c1e0f35a90d8f411d55a8b2b
    container_name: oracle-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "3gb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks:
      - oracle
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 4g

  elasticsearch:
    image: elasticsearch:8.19.16@sha256:282dfd2141199ef3336de829900c0ef1de965b3fcbeade837e299059ceab63a9
    container_name: oracle-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.ml.enabled: "false"
      xpack.security.enabled: "false"
      thread_pool.search.queue_size: "5000"
      logger.org.elasticsearch.discovery: ERROR
      ES_JAVA_OPTS: -Xms6G -Xmx6G
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - oracle
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://elasticsearch:9200/_cluster/health?wait_for_status=yellow >/dev/null || exit 1"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 7g
    memswap_limit: 7g

  minio:
    image: minio/minio:latest@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    container_name: oracle-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - oracle
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g

  rabbitmq:
    image: rabbitmq:4.3-management@sha256:cd4fd60136781671d125ed68ac4b67900c0726b55e2e8b98719daa616a63240b
    container_name: oracle-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_NODENAME: rabbit01@localhost
    volumes:
      - /etc/oracle/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - oracle
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 6
    mem_limit: 2g

  opencti:
    image: opencti/platform:7.260728.0@sha256:5c4922d30a8c279b0fcf2cc03e45d926b243d2aa86ce569ac154d61034f81ebf
    container_name: oracle-opencti
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=6144
      APP__PORT: "8080"
      APP__BASE_URL: https://oracle.guildedthorn.arpa
      APP__ADMIN__EMAIL: ${OPENCTI_ADMIN_EMAIL}
      APP__ADMIN__PASSWORD: ${OPENCTI_ADMIN_PASSWORD}
      APP__ADMIN__TOKEN: ${OPENCTI_ADMIN_TOKEN}
      APP__ENCRYPTION_KEY: ${OPENCTI_ENCRYPTION_KEY}
      APP__HEALTH_ACCESS_KEY: ${OPENCTI_HEALTHCHECK_ACCESS_KEY}
      PROVIDERS__LOCAL__STRATEGY: LocalStrategy
      REDIS__HOSTNAME: redis
      REDIS__PORT: "6379"
      REDIS__TRIMMING: "500000"
      ELASTICSEARCH__URL: http://elasticsearch:9200
      ELASTICSEARCH__NUMBER_OF_REPLICAS: "0"
      MINIO__ENDPOINT: minio
      MINIO__PORT: "9000"
      MINIO__USE_SSL: "false"
      MINIO__ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO__SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RABBITMQ__HOSTNAME: rabbitmq
      RABBITMQ__PORT: "5672"
      RABBITMQ__PORT_MANAGEMENT: "15672"
      RABBITMQ__MANAGEMENT_SSL: "false"
      RABBITMQ__USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ__PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      SMTP__HOSTNAME: localhost
      SMTP__PORT: "25"
    ports:
      - 127.0.0.1:8080:8080
    networks:
      - oracle
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://opencti:8080/health?health_access_key=${OPENCTI_HEALTHCHECK_ACCESS_KEY}"]
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 7g

  worker:
    image: opencti/worker:7.260728.0@sha256:d8d98481e6672d09f6933f0206c49424f48c563d5f344570e3a88272834d97c9
    restart: unless-stopped
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
    networks:
      - oracle
    depends_on:
      opencti:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 4
    mem_limit: 1g

  connector-opencti:
    image: opencti/connector-opencti:7.260728.0@sha256:3b27efc475b691a2fd668b9ee8bf44d977866aa5b5cdaa3d82a331de1512ac78
    container_name: oracle-connector-opencti
    restart: unless-stopped
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      CONNECTOR_ID: ${CONNECTOR_OPENCTI_ID}
      CONNECTOR_NAME: OpenCTI Datasets
      CONNECTOR_SCOPE: marking-definition,identity,location
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_RUN_AND_TERMINATE: "false"
      CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT: "true"
      CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL: "100"
      CONFIG_INTERVAL: "7"
    networks:
      - oracle
    depends_on:
      opencti:
        condition: service_healthy
    mem_limit: 1g

  connector-mitre:
    image: opencti/connector-mitre:7.260728.0@sha256:5d957be87d3c0a53686a7dfe3d3961e06d1fd6449961f2601bb612ec8046eddd
    container_name: oracle-connector-mitre
    restart: unless-stopped
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      CONNECTOR_ID: ${CONNECTOR_MITRE_ID}
      CONNECTOR_NAME: MITRE ATT&CK
      CONNECTOR_SCOPE: mitre
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT: "true"
      CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL: "75"
      MITRE_INTERVAL: "7"
    networks:
      - oracle
    depends_on:
      opencti:
        condition: service_healthy
    mem_limit: 1g

  connector-cisa-kev:
    image: opencti/connector-cisa-known-exploited-vulnerabilities:7.260728.0@sha256:90535ba5464e35284c3c89b1d916a73f8bd7c0b67f76e725bffe196db488cb2b
    container_name: oracle-connector-cisa-kev
    restart: unless-stopped
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      CONNECTOR_ID: ${CONNECTOR_CISA_KEV_ID}
      CONNECTOR_NAME: CISA Known Exploited Vulnerabilities
      CONNECTOR_SCOPE: cisa
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: P1D
      CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT: "true"
      CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL: "100"
      CISA_CATALOG_URL: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
      CISA_CREATE_INFRASTRUCTURES: "false"
      CISA_KEV_FLAG_ONLY: "false"
      CISA_TLP: TLP:CLEAR
    networks:
      - oracle
    depends_on:
      opencti:
        condition: service_healthy
    mem_limit: 768m

  connector-threatfox:
    image: opencti/connector-threatfox:7.260728.0@sha256:d2fa2e0c1f20eeeaaad594162f71d4c18446d48d0951ca4f1e5efc1ba53b4b16
    container_name: oracle-connector-threatfox
    restart: unless-stopped
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      CONNECTOR_ID: ${CONNECTOR_THREATFOX_ID}
      CONNECTOR_NAME: Abuse.ch ThreatFox
      CONNECTOR_SCOPE: ThreatFox
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_DURATION_PERIOD: PT1H
      CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT: "true"
      CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL: "80"
      THREATFOX_CSV_URL: https://threatfox.abuse.ch/export/csv/recent/
      THREATFOX_IMPORT_OFFLINE: "false"
      THREATFOX_CREATE_INDICATORS: "true"
      THREATFOX_DEFAULT_X_OPENCTI_SCORE: "80"
      THREATFOX_IOC_TO_IMPORT: all_types
    networks:
      - oracle
    depends_on:
      opencti:
        condition: service_healthy
    mem_limit: 768m

  connector-first-epss:
    image: opencti/connector-first-epss:7.260728.0@sha256:3f566b241d8289246fa5743d4a45ab46a8b9cecf2d2c9837f1210b2ed0d3b405
    container_name: oracle-connector-first-epss
    restart: unless-stopped
    environment:
      OPENCTI_URL: http://opencti:8080
      OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
      CONNECTOR_ID: ${CONNECTOR_FIRST_EPSS_ID}
      CONNECTOR_NAME: FIRST EPSS Enrichment
      CONNECTOR_SCOPE: vulnerability
      CONNECTOR_LOG_LEVEL: info
      CONNECTOR_AUTO: "true"
      CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT: "true"
      CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL: "100"
      FIRST_EPSS_API_BASE_URL: https://api.first.org/data/v1/epss
      FIRST_EPSS_MAX_TLP: TLP:CLEAR
    networks:
      - oracle
    depends_on:
      opencti:
        condition: service_healthy
    mem_limit: 768m

networks:
  oracle:
    driver: bridge

volumes:
  redis-data:
  elasticsearch-data:
  minio-data:
  rabbitmq-data:
