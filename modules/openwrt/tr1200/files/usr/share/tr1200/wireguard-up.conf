# Use only the home Technitium resolvers while the tunnel is healthy.
no-resolv
server=172.16.25.66
server=172.16.25.2

# Serve bootstrap binaries locally after fetching them through the tunnel.
enable-tftp
tftp-root=/tmp/tr1200-tftp

# Chain clients already running iPXE directly to the HTTP menu.
dhcp-match=set:ipxe,175
dhcp-boot=tag:ipxe,http://172.16.25.53/boot.ipxe

# Bootstrap x86 legacy BIOS and x86-64 UEFI clients over TFTP.
dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
dhcp-boot=tag:bios,tag:!ipxe,undionly.kpxe,,172.20.120.1
dhcp-boot=tag:efi64,tag:!ipxe,ipxe.efi,,172.20.120.1
