keys:
  # Jamie's personal GPG key (YubiKey-backed). Required to edit any secrets
  # file below - decryption prompts for the YubiKey PIN.
  - &admin_jamie 3E2AD2D2A175671C2924D74ECDDB953CD893FC5C
  # Per-host age keys, derived from each host's SSH host ed25519 key via
  # `ssh-to-age`. These let sops-nix decrypt unattended at activation using
  # /etc/ssh/ssh_host_ed25519_key - no YubiKey needed on the host itself.
  - &host_nixos age1sgl6wmc0uxew0hvfsdzpcy5fpftxlny4zssvfv84hwj75j65q9asd84nf2
  - &host_websites age1k3jvm08n7p5yyptjlsuz7mhk0smdg6lh9etgtxdssuzn08v0wysql3wjk2
  - &host_soc age10zuunep3aw3j760st7yz9wydnlmgwr0p30w2wvqyw9kdg8xu5pnq0fpyrh
  - &host_scout age1sn6hvafu0vh97lp6d67m6ee35j0twg6nysswr6k29q3wt90ezefsmewj4d
  - &host_mac age17t2hdf3ppalwqqtj75nmnwxh5vgam7cgg8h73cqaqg0cptfu9sxs5zatwh

creation_rules:
  # Shared Alloy writer identity. Every currently installed host must be able
  # to decrypt it unattended; the certificate can push telemetry but nginx
  # does not permit it to query Loki or Prometheus.
  - path_regex: hosts/shared/telemetry-secrets\.ya?ml$
    pgp: *admin_jamie
    age: >-
      age1sgl6wmc0uxew0hvfsdzpcy5fpftxlny4zssvfv84hwj75j65q9asd84nf2,
      age1k3jvm08n7p5yyptjlsuz7mhk0smdg6lh9etgtxdssuzn08v0wysql3wjk2,
      age10zuunep3aw3j760st7yz9wydnlmgwr0p30w2wvqyw9kdg8xu5pnq0fpyrh,
      age1sn6hvafu0vh97lp6d67m6ee35j0twg6nysswr6k29q3wt90ezefsmewj4d,
      age17t2hdf3ppalwqqtj75nmnwxh5vgam7cgg8h73cqaqg0cptfu9sxs5zatwh
  - path_regex: hosts/mac/secrets\.ya?ml$
    pgp: *admin_jamie
    age: *host_mac
  - path_regex: hosts/scout/secrets\.ya?ml$
    pgp: *admin_jamie
    age: *host_scout
  - path_regex: hosts/soc/secrets\.ya?ml$
    pgp: *admin_jamie
    age: *host_soc
  - path_regex: hosts/nixos/secrets\.ya?ml$
    pgp: *admin_jamie
    age: *host_nixos
  - path_regex: hosts/websites/secrets\.ya?ml$
    pgp: *admin_jamie
    age: *host_websites
