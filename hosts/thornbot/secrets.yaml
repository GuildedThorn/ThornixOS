# ThornBot environment (single opaque dotenv secret, key: thornbot_env).
#
# This file must be sops-encrypted before it can be deployed. After adding the
# thornbot rule to .sops.yaml (with the host's age key), run:
#
#     sops hosts/thornbot/secrets.yaml
#
# and paste the bot's full environment. Every value here overrides the default
# baked into Resources/config.json. At minimum:
#
#     TOKEN=<Discord bot token>
#     Discord__OwnerId=<owner snowflake>
#     Discord__AuditChannelId=<moderation audit channel snowflake>
#     Lavalink__Authorization=<random, NOT youshallnotpass>
#     RabbitMQ__UserName=thornbot
#     RabbitMQ__Password=<random, NOT guest>
#     Moderation__WarnStorePath=/var/lib/thornbot/warns.json
#
# The Lavalink password and RabbitMQ password must both differ from their
# insecure defaults or SecurityValidator refuses to start.
thornbot_env: PLACEHOLDER_REPLACE_WITH_SOPS_ENCRYPTED_VALUE
